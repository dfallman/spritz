[package]
name = "api"
version.workspace = true
edition = "2024"
description = "HTTP + M3U server for the Spritz DLNA media server."
license.workspace = true
repository.workspace = true
authors.workspace = true

[dependencies]
anyhow = "1.0.102"
axum = "0.8.8"
dlna = { version = "0.2.0", path = "../dlna" }
uuid = { version = "1", features = ["v5"] }
hostname = "0.4"
spritz-core = { version = "0.2.0", path = "../core" }
local-ip-address = "0.6.11"
tokio = { version = "1.51.1", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["io"] }
socket2 = "0.6"
tower = "0.5"
tower-http = { version = "0.6.8", features = ["fs", "set-header"] }
tracing = "0.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
if-addrs = "0.15"

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.51.1", features = ["test-util"] }

[target.'cfg(not(target_os = "macos"))'.dependencies]
mdns-sd = "0.21.4"
